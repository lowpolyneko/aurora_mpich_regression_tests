spec:
  inputs:
    allocation:
      default: Aurora_testing
      description: ALCF allocation to charge the jobs to (-A).
    cluster:
      options: [aurora, aurora-eval, sunspot]
      default: aurora
      description: Cluster the jobs build and test on (shell and batch runners).
    queue:
      default: debug
      description: Test job queue (-q), e.g. debug, debug-scaling, next-eval.
    mpich_refs:
      type: array
      default: ['aurora_test']
      description: MPICH refs to build and test.
    nodes:
      type: array
      default: ['1', '2', '32']
      description: Node counts to test, one <N>node suite per value.
---
stages:
  - build
  - test

include:
  - local: 'ci/runners.yml'
    inputs:
      cluster: $[[ inputs.cluster ]]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH ==
        $CI_DEFAULT_BRANCH'

.mpich-ci-shell:
  extends: .mpich-ci-shell-runner
  variables:
    MPICH_CI_ALLOCATION: $[[ inputs.allocation ]]
  parallel:
    matrix:
      - MPICH_REF: $[[ inputs.mpich_refs ]]

.mpich-ci-batch:
  extends: .mpich-ci-batch-runner
  variables:
    MPICH_CI_ALLOCATION: $[[ inputs.allocation ]]
  parallel:
    matrix:
      - MPICH_REF: $[[ inputs.mpich_refs ]]
        MPICH_CI_NODES: $[[ inputs.nodes ]]

.mpich-ci-test:
  extends: .mpich-ci-batch
  stage: test
  timeout: 1 day
  interruptible: false
  resource_group: $[[ inputs.cluster ]]-$[[ inputs.queue ]]
  needs:
    - job: build-mpich
      parallel:
        matrix:
          - MPICH_REF: '$[[ matrix.MPICH_REF ]]'
  variables:
    ANL_AURORA_SCHEDULER_PARAMETERS: >-
      -A $[[ inputs.allocation ]]
      -l select=${MPICH_CI_NODES},walltime=01:00:00,filesystems=home:flare
      -q $[[ inputs.queue ]]
    ANL_AURORA_EVAL_SCHEDULER_PARAMETERS: >-
      -A $[[ inputs.allocation ]]
      -l select=${MPICH_CI_NODES},walltime=01:00:00,filesystems=home:flare
      -q $[[ inputs.queue ]]
    ANL_SUNSPOT_SCHEDULER_PARAMETERS: >-
      -A $[[ inputs.allocation ]]
      -l select=${MPICH_CI_NODES},walltime=01:00:00,filesystems=home:tegu
      -q $[[ inputs.queue ]]
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - reports/
    reports:
      junit: reports/*.xml

build-mpich:
  extends: .mpich-ci-shell
  stage: build
  timeout: 2h
  interruptible: true
  script:
    - ./ci/build-mpich.sh

test-suite:
  extends: .mpich-ci-test
  script:
    - ./ci/run-suite.sh "${MPICH_CI_NODES}node"
